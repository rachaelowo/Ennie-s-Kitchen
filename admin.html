<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('ennieskitchen_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ennieskitchen</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px;}
  .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
  .admin-header h1{font-size:26px;}
  #loginBox{max-width:360px;margin:80px auto;}
  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:32px;}
  .stat-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .stat-card .stat-num{font-size:22px;font-weight:600;color:var(--terracotta);}
  .stat-card .stat-label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .admin-section{margin-bottom:40px;}
  .admin-section h3{margin-bottom:14px;}
  .admin-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
  .admin-row-main{flex:1;font-size:14px;}
  .admin-meta{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .admin-items{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .btn-delete{background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .btn-delete:hover{border-color:#C0392B;color:#C0392B;}
  @media (max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<div class="admin-wrap">
  <form id="loginBox" onsubmit="adminLogin(event)">
    <h1 style="font-size:22px;margin-bottom:16px;text-align:center;">Ennieskitchen Admin</h1>
    <div class="field" style="margin-bottom:10px;"><label>Email</label><input type="email" id="adminEmail" required></div>
    <div class="field" style="margin-bottom:14px;"><label>Password</label><input type="password" id="adminPassword" required></div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Log in</button>
    <p class="form-status" id="loginStatus"></p>
  </form>

  <div id="adminDash" class="hidden">
    <div class="admin-header">
      <h1>Admin dashboard</h1>
      <button class="btn btn-outline" onclick="adminLogout()">Log out</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" id="statTotalOrders">—</div><div class="stat-label">Total orders</div></div>
      <div class="stat-card"><div class="stat-num" id="statTotalRevenue">—</div><div class="stat-label">Total revenue</div></div>
      <div class="stat-card"><div class="stat-num" id="statCateringCount">—</div><div class="stat-label">Catering requests</div></div>
      <div class="stat-card"><div class="stat-num" id="statReviewCount">—</div><div class="stat-label">Reviews</div></div>
      <div class="stat-card"><div class="stat-num" id="statAvgRating">—</div><div class="stat-label">Avg rating</div></div>
    </div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-20px;margin-bottom:32px;">Orders by payment method: <span id="statByMethod">—</span></p>

    <div class="admin-section">
      <h3>Catering requests</h3>
      <div id="cateringList"></div>
    </div>

    <div class="admin-section">
      <h3>Orders</h3>
      <div id="ordersList"></div>
    </div>

    <div class="admin-section">
      <h3>Reviews</h3>
      <div id="reviewsAdminList"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/reviews-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
